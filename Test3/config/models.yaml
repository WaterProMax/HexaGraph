# 工作台模型配置（当前指向 DeepSeek，key 用 .env 的 DASHSCOPE_API_KEY，值填的是 DeepSeek key）。
# 回退到阿里云百炼：base_url 改回 https://dashscope.aliyuncs.com/compatible-mode/v1，
# 槽位模型改回注释中的原值，并在 .env 放真实百炼 key。
# 已知限制：DeepSeek 不提供 embedding 接口，环境监听（反馈聚类）不可用；其余流程不受影响。
provider: dashscope
base_url: https://api.deepseek.com
api_key_env: DASHSCOPE_API_KEY
limits:
  max_concurrency: 6
  requests_per_minute: 120
slots:
  flagship:
    model: deepseek-v4-pro          # 原 qwen3.8-max-0902
    temperature: 0.3
    max_tokens: 32768               # 原 8192；Leader 任务计划单次输出约 22K token，8192 会耗尽思考预算导致空输出
    fallback: deepseek-flash        # 原 qwen3.7-plus
    json_mode: true
    tool_calls: true
    context_window: 32768
    price_per_1k_in: 0.0
    price_per_1k_out: 0.0
    extra_body: {}
  flagship_alt:
    model: deepseek-v4-pro          # 原 kimi-k3
    temperature: 0.3
    max_tokens: 32768               # 原 8192
    fallback: deepseek-flash        # 原 qwen3.8-max-0902
    json_mode: true
    tool_calls: true
    context_window: 65536
    price_per_1k_in: 0.0
    price_per_1k_out: 0.0
    extra_body: {}
  coder:
    model: deepseek-flash           # 原 qwen3-coder-flash
    temperature: 0.2
    max_tokens: 16384               # 原 8192
    fallback: deepseek-v4-pro       # 原 qwen3.7-plus
    json_mode: true
    tool_calls: true
    context_window: 131072
    price_per_1k_in: 0.0
    price_per_1k_out: 0.0
    extra_body: {}
  balanced:
    model: deepseek-flash           # 原 qwen3.7-plus
    temperature: 0.3
    max_tokens: 4096
    fallback: deepseek-v4-pro       # 原 qwen3.8-max-0902
    json_mode: true
    tool_calls: false
    context_window: 32768
    price_per_1k_in: 0.0
    price_per_1k_out: 0.0
    extra_body: {}
  fast:
    model: deepseek-flash           # 原 qwen-mt-flash
    temperature: 0.1
    max_tokens: 4096
    fallback: ""                    # 原 qwen3.7-plus
    json_mode: true
    tool_calls: false
    context_window: 32768
    price_per_1k_in: 0.0
    price_per_1k_out: 0.0
    extra_body: {}
  embedding:
    model: text-embedding-v4        # 仅百炼可用；DeepSeek 模式下环境监听聚类会失败
    dimensions: 1024
    fallback: ""
    json_mode: false
    tool_calls: false
    extra_body: {}
