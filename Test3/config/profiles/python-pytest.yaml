name: python-pytest
language: python
initial_files:
  README.md: |
    # workspace
    generated by Test3
  src/__init__.py: ""
  tests/__init__.py: ""
  tests/test_smoke.py: |
    def test_smoke() -> None:
        assert True
whitelist_prefixes:
  - pytest
  - python -m pytest
  - python -m ruff
  - ruff check
forbidden_prefixes:
  - pip
  - curl
  - wget
  - bash
  - sh
test_command: ["python", "-m", "pytest", "-q"]
empty_test_patterns:
  - "no tests ran"
  - "collected 0 items"
  - "no tests collected"
skip_all_patterns:
  - "skipped"
  - "Skip"
env_allowlist:
  - PATH
  - HOME
  - LANG
  - LC_ALL
  - PYTHONPATH
  - TMPDIR
  - TZ
output_truncate: 8000
prepare: []
