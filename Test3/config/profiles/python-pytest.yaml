name: python-pytest
language: python
initial_files:
  .gitignore: |
    __pycache__/
    *.pyc
    .pytest_cache/
  README.md: |
    # workspace
    generated by Test3
  src/__init__.py: ""
  tests/__init__.py: ""
  tests/test_smoke.py: |
    def test_smoke() -> None:
        assert True
whitelist_prefixes:
  - pytest
  - python -m pytest
  - python -m ruff
  - ruff check
forbidden_prefixes:
  - pip
  - curl
  - wget
  - bash
  - sh
test_command: ["python", "-m", "pytest", "-q"]
empty_test_patterns:
  - "no tests ran"
  - "collected 0 items"
  - "no tests collected"
skip_all_patterns:
  - "skipped"
  - "Skip"
env_allowlist:
  - PATH
  - HOME
  - LANG
  - LC_ALL
  - PYTHONPATH
  - TMPDIR
  - TZ
  # Windows 子进程必需的系统环境：缺 SYSTEMROOT 时 asyncio/_overlapped 初始化报 WinError 10106
  - SYSTEMROOT
  - WINDIR
  - SYSTEMDRIVE
  - TEMP
  - TMP
  - COMSPEC
  - PATHEXT
output_truncate: 8000
prepare: []
