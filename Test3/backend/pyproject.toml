[project]
name = "hexagraph-test3"
version = "0.1.0"
description = "Test3 multi-body workflow workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "openai>=1.57",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "numpy>=2.1",
  "python-multipart>=0.0.17",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: calls real DashScope (deselect by default)",
  "closeout: whole-book close gate; needs a real PR record (run explicitly, not in the default regression)",
]
addopts = "-q -m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
show_error_codes = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
